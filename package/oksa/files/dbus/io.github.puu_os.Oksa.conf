<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="io.github.puu_os.Oksa"/>
    <deny send_destination="io.github.puu_os.Oksa"/>
    <deny receive_sender="io.github.puu_os.Oksa" receive_type="signal"/>
  </policy>
  <policy user="root">
    <allow own="io.github.puu_os.Oksa"/>
    <allow send_destination="io.github.puu_os.Oksa"/>
    <allow receive_sender="io.github.puu_os.Oksa"/>
  </policy>
  <policy user="oksa">
    <allow send_destination="io.github.puu_os.Oksa"/>
    <allow receive_sender="io.github.puu_os.Oksa"/>
  </policy>
</busconfig>
