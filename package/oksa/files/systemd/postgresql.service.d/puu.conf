[Service]
# Cluster pods reach the LiteLLM database through the node address, so the
# server has to listen beyond loopback from its very first start.  Buildroot's
# unit starts postgres without -c options, and listen_addresses is a postmaster
# setting that a reload cannot apply, so set it on the command line instead.
# pg_hba.conf still admits cluster clients only.
ExecStart=
ExecStart=/usr/bin/postgres -D /var/lib/pgsql -c listen_addresses=*
