apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: llm-d
  namespace: kube-system
spec:
  chart: oci://ghcr.io/llm-d/charts/llm-d-router-gateway@sha256:63a79a842974691be73d44918c7086bcc52d6fee546ff39113517a23c03eeab0
  version: v0.11.0
  targetNamespace: puu-ai
  createNamespace: true
  valuesContent: |-
    provider:
      name: none

    router:
      epp:
        image:
          tag: v0.11.0@sha256:39257d24552d16d8f215d3de25cc734fd44af3b282b67032db01aff900c610cf
          pullPolicy: IfNotPresent
        flags:
          v: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi

      modelServers:
        targetPorts:
          - number: 8000
        type: vllm
        protocol: http
        matchLabels:
          "@OKSA_LABEL_NAMESPACE@/inference": "enabled"
          "@OKSA_LABEL_NAMESPACE@/model-server": vllm
          "@OKSA_LABEL_NAMESPACE@/model-capacity": gpu
          "@OKSA_LABEL_NAMESPACE@/model-source": local-discovery
          "@OKSA_LABEL_NAMESPACE@/cluster-routing": "enabled"

    httpRoute:
      create: true
      inferenceGatewayName: llm-d-inference-gateway
      requestTimeout: 300s
