apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: oksa
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui@sha256:90eae5b419e40b4c3dd684582b2c83440b36f9ae2f6532c09639b2ba4ee65158
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              python3 - <<'PY'
              from contextlib import closing
              import json
              from pathlib import Path
              import sqlite3

              data_dir = Path("/app/backend/data")
              database = data_dir / "webui.db"
              marker = data_dir / ".puu-model-identity-v1"
              canonical = "fraserprice/Ternary-Bonsai-2-27B-vllm"
              aliases = {"prism-ml/bonsai-2-27b", "bonsai-2-27b", "ternary-bonsai-2-27b-vllm"}

              def rename(value):
                  return canonical if isinstance(value, str) and value.strip().lower() in aliases else value

              if database.exists() and not marker.exists():
                  with closing(sqlite3.connect(database)) as db, db:
                      backup = data_dir / "webui-before-model-identity.db"
                      if not backup.exists():
                          temporary = backup.with_suffix(".tmp")
                          temporary.unlink(missing_ok=True)
                          temporary.touch(mode=0o600)
                          with closing(sqlite3.connect(temporary)) as snapshot:
                              db.backup(snapshot)
                          temporary.replace(backup)
                      db.execute("BEGIN IMMEDIATE")
                      tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                      for table, column, paths in (
                          ("config", "data", ("ui.default_models", "ui.default_pinned_models", "ui.model_order_list")),
                          ("user", "settings", ("ui.models", "ui.pinnedModels")),
                          ("chat", "chat", ("models",)),
                          ("folder", "data", ("model_ids",)),
                      ):
                          if table not in tables:
                              continue
                          for row_id, raw in db.execute(f'SELECT id, "{column}" FROM "{table}"').fetchall():
                              if raw is None:
                                  continue
                              data = json.loads(raw)
                              changed = False
                              for path in paths:
                                  keys = path.split(".")
                                  parent = data
                                  for key in keys[:-1]:
                                      parent = parent.get(key) if isinstance(parent, dict) else None
                                  if not isinstance(parent, dict) or keys[-1] not in parent:
                                      continue
                                  value = parent[keys[-1]]
                                  if isinstance(value, list):
                                      updated = [rename(item) for item in value]
                                  elif isinstance(value, str):
                                      updated = ",".join(rename(item) for item in value.split(","))
                                  else:
                                      continue
                                  if updated != value:
                                      parent[keys[-1]] = updated
                                      changed = True
                              if changed:
                                  db.execute(f'UPDATE "{table}" SET "{column}"=? WHERE id=?', (json.dumps(data), row_id))
                  marker.touch()
              PY
              exec bash /app/backend/start.sh
          env:
            - name: WEBUI_NAME
              value: Puu AI
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: ENABLE_OPENAI_API
              value: "True"
            - name: OPENAI_API_BASE_URL
              value: http://litellm.oksa.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: puu-litellm-openwebui-key
                  key: api_key
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: secretkey
            - name: DEFAULT_MODELS
              value: "fraserprice/Ternary-Bonsai-2-27B-vllm"
            - name: ENABLE_EVALUATION_ARENA_MODELS
              value: "False"
            - name: ENABLE_WEB_SEARCH
              value: "True"
            - name: WEB_SEARCH_ENGINE
              value: "duckduckgo"
            - name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL
              value: "True"
            - name: USER_AGENT
              value: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
            - name: DEFAULT_MODEL_METADATA
              value: '{"capabilities":{"web_search":true},"defaultFeatureIds":["web_search"]}'
            - name: QUERY_GENERATION_PROMPT_TEMPLATE
              value: |
                ### Task:
                Analyze the chat history to determine the necessity of generating search queries, in the given language. By default, **prioritize generating 1-3 broad and relevant search queries** unless it is absolutely certain that no additional information is required. The aim is to retrieve comprehensive, updated, and valuable information even with minimal uncertainty. If no search is unequivocally needed, return an empty list.

                ### Guidelines:
                - Respond **EXCLUSIVELY** with a JSON object. Any form of extra commentary, explanation, or additional text is strictly prohibited.
                - When generating search queries, include relevant filters or contextual qualifiers (such as country e.g. Finland, industry, or company) when appropriate to improve relevance.
                - When generating search queries, respond in the format: { "queries": ["query1", "query2"] }, ensuring each query is distinct, concise, and relevant to the topic.
                - If and only if it is entirely certain that no useful results can be retrieved by a search, return: { "queries": [] }.
                - Err on the side of suggesting search queries if there is **any chance** they might provide useful or updated information.
                - Be concise and focused on composing high-quality search queries, avoiding unnecessary elaboration, commentary, or assumptions.
                - Today's date is: {{CURRENT_DATE}}.
                - Always prioritize providing actionable and broad queries that maximize informational coverage.

                ### Output:
                Strictly return in JSON format: 
                {
                  "queries": ["query1", "query2"]
                }

                ### Chat History:
                <chat_history>
                {{MESSAGES:END:6}}
                </chat_history>
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/puu/open-webui
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: oksa
  labels:
    app.kubernetes.io/name: open-webui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
