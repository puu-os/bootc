apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: oksa
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui@sha256:90eae5b419e40b4c3dd684582b2c83440b36f9ae2f6532c09639b2ba4ee65158
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              python3 - <<'PY'
              from contextlib import closing
              import glob
              import json
              from pathlib import Path
              import re
              import sqlite3
              import textwrap

              data_dir = Path("/app/backend/data")
              database = data_dir / "webui.db"
              marker = data_dir / ".puu-model-identity-v1"
              canonical = "fraserprice/Ternary-Bonsai-2-27B-vllm"
              aliases = {"prism-ml/bonsai-2-27b", "bonsai-2-27b", "ternary-bonsai-2-27b-vllm"}

              def rename(value):
                  return canonical if isinstance(value, str) and value.strip().lower() in aliases else value

              if database.exists():
                  with closing(sqlite3.connect(database)) as db, db:
                      if not marker.exists():
                          backup = data_dir / "webui-before-model-identity.db"
                          if not backup.exists():
                              temporary = backup.with_suffix(".tmp")
                              temporary.unlink(missing_ok=True)
                              temporary.touch(mode=0o600)
                              with closing(sqlite3.connect(temporary)) as snapshot:
                                  db.backup(snapshot)
                              temporary.replace(backup)
                      db.execute("BEGIN IMMEDIATE")
                      tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                      if not marker.exists():
                          for table, column, paths in (
                              ("config", "data", ("ui.default_models", "ui.default_pinned_models", "ui.model_order_list")),
                              ("user", "settings", ("ui.models", "ui.pinnedModels")),
                              ("chat", "chat", ("models",)),
                              ("folder", "data", ("model_ids",)),
                          ):
                              if table not in tables:
                                  continue
                              for row_id, raw in db.execute(f'SELECT id, "{column}" FROM "{table}"').fetchall():
                                  if raw is None:
                                      continue
                                  data = json.loads(raw)
                                  changed = False
                                  for path in paths:
                                      keys = path.split(".")
                                      parent = data
                                      for key in keys[:-1]:
                                          parent = parent.get(key) if isinstance(parent, dict) else None
                                      if not isinstance(parent, dict) or keys[-1] not in parent:
                                          continue
                                      value = parent[keys[-1]]
                                      if isinstance(value, list):
                                          updated = [rename(item) for item in value]
                                      elif isinstance(value, str):
                                          updated = ",".join(rename(item) for item in value.split(","))
                                      else:
                                          continue
                                      if updated != value:
                                          parent[keys[-1]] = updated
                                          changed = True
                                  if changed:
                                      db.execute(f'UPDATE "{table}" SET "{column}"=? WHERE id=?', (json.dumps(data), row_id))
                          if "model" in tables:
                              for row_id, base_id, name in db.execute('SELECT id, base_model_id, name FROM "model"').fetchall():
                                  new_id, new_base, new_name = rename(row_id), rename(base_id), rename(name)
                                  if (new_id, new_base, new_name) != (row_id, base_id, name):
                                      if new_id != row_id and db.execute('SELECT 1 FROM "model" WHERE id=?', (new_id,)).fetchone():
                                          db.execute('DELETE FROM "model" WHERE id=?', (row_id,))
                                      else:
                                          db.execute('UPDATE "model" SET id=?, base_model_id=?, name=? WHERE id=?', (new_id, new_base, new_name, row_id))
                      if "config" in tables:
                          for row_id, raw in db.execute('SELECT id, "data" FROM "config"').fetchall():
                              if raw is None:
                                  continue
                              data = json.loads(raw)
                              if not isinstance(data, dict):
                                  continue
                              changed = False
                              rag = data.get("rag")
                              if isinstance(rag, dict):
                                  web = rag.get("web")
                                  if isinstance(web, dict) and isinstance(web.get("search"), dict):
                                      search = web["search"]
                                      for k, v in (
                                          ("enable", True),
                                          ("engine", "duckduckgo"),
                                          ("bypass_embedding_and_retrieval", True),
                                          ("bypass_web_loader", True),
                                      ):
                                          if search.get(k) != v:
                                              search[k] = v
                                              changed = True
                                  if rag.pop("template", None) is not None:
                                      changed = True
                              task = data.get("task")
                              if isinstance(task, dict) and isinstance(task.get("query"), dict):
                                  if task["query"].pop("prompt_template", None) is not None:
                                      changed = True
                              if changed:
                                  db.execute('UPDATE "config" SET "data"=? WHERE id=?', (json.dumps(data), row_id))
                  marker.touch()

              for p in glob.glob("/app/build/_app/immutable/chunks/*.js"):
                  try:
                      with open(p, "r") as f:
                          c = f.read()
                      if "https://www.gravatar.com/avatar/" in c and 'n.startsWith("http://")' not in c:
                          c = c.replace(
                              'n.startsWith("https://www.gravatar.com/avatar/")||n.startsWith("data:")||n.startsWith("/")',
                              'n.startsWith("https://www.gravatar.com/avatar/")||n.startsWith("http://")||n.startsWith("https://")||n.startsWith("data:")||n.startsWith("/")',
                          )
                          c = c.replace(
                              '<img draggable="false" data-cy="image"/>',
                              '<img draggable="false" data-cy="image" referrerpolicy="no-referrer"/>',
                          )
                          c = c.replace(
                              '<img class=" mx-auto h-full object-scale-down select-none" draggable="false"/>',
                              '<img class=" mx-auto h-full object-scale-down select-none" draggable="false" referrerpolicy="no-referrer"/>',
                          )
                          with open(p, "w") as f:
                              f.write(c)
                  except Exception:
                      pass

              ddg_path = Path("/app/backend/open_webui/retrieval/web/duckduckgo.py")
              if ddg_path.exists():
                  try:
                      ddg_code = ddg_path.read_text()
                      if "_search_web_images" not in ddg_code:
                          ddg_code = ddg_code.replace(
                              "from __future__ import annotations\n",
                              "from __future__ import annotations\n\nimport json\nimport re\nimport urllib.parse\nimport urllib.request\n",
                          )
                          helper = textwrap.dedent('''
                              _IMAGE_QUERY_RE = re.compile(
                                  r'\\b(images?|photos?|pictures?|pics?|illustrations?|diagrams?|visuals?|kuva|kuvat|valokuva|valokuvat|bild|bilder)\\b|look like|looks like',
                                  re.IGNORECASE,
                              )

                              def _search_web_images(query: str, count: int) -> list[SearchResult]:
                                  term = re.sub(
                                      r'\\b(show\\s+me|find\\s+me|give\\s+me|search\\s+for|look\\s+up|images?|photos?|pictures?|pics?|illustrations?|diagrams?|visuals?|kuva|kuvat|valokuva|valokuvat|bild|bilder|from|on|in|of|the|a|an|internet|web|online)\\b|look\\s+like|looks\\s+like',
                                      ' ',
                                      query,
                                      flags=re.IGNORECASE,
                                  ).strip()
                                  term = ' '.join(term.split()) or query.strip()
                                  results: list[SearchResult] = []
                                  seen: set[str] = set()
                                  headers = {'User-Agent': 'PuuOS-OpenWebUI/1.0'}

                                  try:
                                      q = urllib.parse.quote(f"filetype:bitmap {term}")
                                      w_url = f"https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch={q}&gsrlimit={count}&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=1280&format=json"
                                      req = urllib.request.Request(w_url, headers=headers)
                                      with urllib.request.urlopen(req, timeout=5) as r:
                                          cdata = json.loads(r.read().decode())
                                      pages = sorted(cdata.get('query', {}).get('pages', {}).values(), key=lambda item: item.get('index', 999))
                                      for p in pages:
                                          info = p.get('imageinfo', [{}])[0]
                                          src = info.get('thumburl') or info.get('url')
                                          mime = info.get('mime', '')
                                          title = p.get('title', 'Image').replace('File:', '').rsplit('.', 1)[0]
                                          if src and src not in seen and (mime.startswith('image/') or src.lower().split('?')[0].endswith(('.jpg', '.jpeg', '.png', '.webp', '.svg', '.gif'))):
                                              seen.add(src)
                                              results.append(
                                                  SearchResult(
                                                      link=f"https://commons.wikimedia.org/wiki/{urllib.parse.quote(p.get('title', '').replace(' ', '_'))}",
                                                      title=title,
                                                      snippet=f"![{title}]({src})\\nDirect image: {src}",
                                                  )
                                              )
                                  except Exception as e:
                                      log.debug(f"Wikimedia commons image search error: {e}")

                                  if len(results) < count:
                                      try:
                                          needed = count - len(results)
                                          img_url = f"https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch={urllib.parse.quote(term)}&gsrlimit={min(needed, 5)}&prop=pageimages|extracts&piprop=original|thumbnail&pithumbsize=1280&exintro=1&explaintext=1&exchars=200&format=json"
                                          req2 = urllib.request.Request(img_url, headers=headers)
                                          with urllib.request.urlopen(req2, timeout=5) as r:
                                              pdata = json.loads(r.read().decode())
                                          pages = sorted(pdata.get('query', {}).get('pages', {}).values(), key=lambda item: item.get('index', 999))
                                          for p in pages:
                                              src = p.get('original', {}).get('source') or p.get('thumbnail', {}).get('source')
                                              title = p.get('title', term)
                                              extract = p.get('extract', '')
                                              if src and src not in seen and src.lower().split('?')[0].endswith(('.jpg', '.jpeg', '.png', '.webp', '.svg', '.gif')):
                                                  seen.add(src)
                                                  results.append(
                                                      SearchResult(
                                                          link=f"https://en.wikipedia.org/wiki/{urllib.parse.quote(title.replace(' ', '_'))}",
                                                          title=title,
                                                          snippet=f"![{title}]({src})\\n{extract}\\nDirect image: {src}".strip(),
                                                      )
                                                  )
                                      except Exception as e:
                                          log.debug(f"Wikipedia image search error: {e}")

                                  return results
                          ''').strip()
                          ddg_code = ddg_code.replace("def search_duckduckgo(", helper + "\n\ndef search_duckduckgo(")
                          branch = textwrap.dedent('''
                              if _IMAGE_QUERY_RE.search(query):
                                  img_results = _search_web_images(query, count)
                                  if img_results:
                                      return img_results[:count]
                          ''').strip()
                          indented_branch = textwrap.indent(branch, "    ")
                          target_pos = "    # The ddgs library (primp-based) does not auto-detect proxy env vars."
                          ddg_code = ddg_code.replace(target_pos, indented_branch + "\n\n" + target_pos)
                          ddg_path.write_text(ddg_code)
                  except Exception:
                      pass

              mw_path = Path("/app/backend/open_webui/utils/middleware.py")
              if mw_path.exists():
                  try:
                      mw_code = mw_path.read_text()
                      if "_IMAGE_QUERY_RE" not in mw_code:
                          q_target = "    await event_emitter(\n        {\n            'type': 'status',\n            'data': {\n                'action': 'web_search_queries_generated',"
                          q_patch = (
                              "    import open_webui.retrieval.web.duckduckgo as _ddg\n"
                              "    _img_re = getattr(_ddg, '_IMAGE_QUERY_RE', None)\n"
                              "    if user_message and _img_re and _img_re.search(user_message):\n"
                              "        queries = [q if _img_re.search(q) else f'{q} photo' for q in queries]\n\n"
                              + q_target
                          )
                          mw_code = mw_code.replace(q_target, q_patch, 1)
                          d_target = "            elif results.get('docs'):\n                # Invoked when bypass embedding and retrieval is set to True\n                docs = results['docs']\n"
                          d_patch = (
                              d_target
                              + "                image_files = []\n"
                              + "                for doc in docs:\n"
                              + "                    for m in re.finditer(r'^Direct image:\\s*(\\S+)', doc.get('content', ''), re.MULTILINE):\n"
                              + "                        img_url = m.group(1).strip()\n"
                              + "                        if img_url and not any(f['url'] == img_url for f in image_files):\n"
                              + "                            image_files.append({'type': 'image', 'url': img_url, 'name': doc.get('metadata', {}).get('title') or 'Image'})\n"
                              + "                if image_files:\n"
                              + "                    await event_emitter({'type': 'files', 'data': {'files': image_files[:3]}})\n"
                          )
                          mw_code = mw_code.replace(d_target, d_patch, 1)
                          mw_path.write_text(mw_code)
                  except Exception:
                      pass
              PY
              exec bash /app/backend/start.sh
          env:
            - name: WEBUI_NAME
              value: Puu AI
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: ENABLE_OPENAI_API
              value: "True"
            - name: OPENAI_API_BASE_URL
              value: http://litellm.oksa.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: puu-litellm-openwebui-key
                  key: api_key
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: secretkey
            - name: DEFAULT_MODELS
              value: "fraserprice/Ternary-Bonsai-2-27B-vllm"
            - name: ENABLE_EVALUATION_ARENA_MODELS
              value: "False"
            - name: ENABLE_WEB_SEARCH
              value: "True"
            - name: WEB_SEARCH_ENGINE
              value: "duckduckgo"
            - name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL
              value: "True"
            - name: BYPASS_WEB_SEARCH_WEB_LOADER
              value: "True"
            - name: USER_AGENT
              value: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
            - name: DEFAULT_MODEL_METADATA
              value: '{"capabilities":{"web_search":true},"defaultFeatureIds":["web_search"]}'
            - name: RAG_TEMPLATE
              value: |
                ### Task:
                Respond to the user query using the provided context, incorporating inline citations in the format [id] **only when the <source> tag includes an explicit id attribute** (e.g., <source id="1">).

                ### Guidelines:
                - If you don't know the answer, clearly state that.
                - If uncertain, ask the user for clarification.
                - Respond in the same language as the user's query.
                - If the context is unreadable or of poor quality, inform the user and provide the best possible answer.
                - If the answer isn't present in the context but you possess the knowledge, explain this to the user and provide the answer using your own understanding.
                - When the user asks for an image, photo, or picture and <context> contains markdown images (such as ![title](https://...)), include the markdown image ![title](https://...) directly in your response so the image is displayed. Never say you cannot display or show images when markdown images are present in <context>.
                - **Only include inline citations using [id] (e.g., [1], [2]) when the <source> tag includes an id attribute.**
                - Do not cite if the <source> tag does not contain an id attribute.
                - Do not use XML tags in your response.
                - Ensure citations are concise and directly related to the information provided.

                ### Output:
                Provide a clear and direct response to the user's query, including inline citations in the format [id] only when the <source> tag with id attribute is present in the context.

                <context>
                {{CONTEXT}}
                </context>
            - name: QUERY_GENERATION_PROMPT_TEMPLATE
              value: |
                ### Task:
                Analyze the chat history to determine the necessity of generating search queries, in the given language. By default, **prioritize generating 1-3 broad and relevant search queries** unless it is absolutely certain that no additional information is required. The aim is to retrieve comprehensive, updated, and valuable information even with minimal uncertainty. If no search is unequivocally needed, return an empty list.

                ### Guidelines:
                - Respond **EXCLUSIVELY** with a JSON object. Any form of extra commentary, explanation, or additional text is strictly prohibited.
                - When generating search queries, include relevant filters or contextual qualifiers (such as country e.g. Finland, industry, or company) when appropriate to improve relevance.
                - When generating search queries, respond in the format: { "queries": ["query1", "query2"] }, ensuring each query is distinct, concise, and relevant to the topic.
                - If and only if it is entirely certain that no useful results can be retrieved by a search, return: { "queries": [] }.
                - Err on the side of suggesting search queries if there is **any chance** they might provide useful or updated information.
                - Be concise and focused on composing high-quality search queries, avoiding unnecessary elaboration, commentary, or assumptions.
                - Today's date is: {{CURRENT_DATE}}.
                - Always prioritize providing actionable and broad queries that maximize informational coverage.
                - When the user requests images, photos, or pictures, explicitly include "photo" or "picture" in the search query.

                ### Output:
                Strictly return in JSON format: 
                {
                  "queries": ["query1", "query2"]
                }

                ### Chat History:
                <chat_history>
                {{MESSAGES:END:6}}
                </chat_history>
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/puu/open-webui
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: oksa
  labels:
    app.kubernetes.io/name: open-webui
spec:
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
