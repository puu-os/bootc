apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: puu-ai
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui@sha256:90eae5b419e40b4c3dd684582b2c83440b36f9ae2f6532c09639b2ba4ee65158
          imagePullPolicy: IfNotPresent
          env:
            - name: WEBUI_NAME
              value: Puu AI
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: ENABLE_OPENAI_API
              value: "True"
            - name: OPENAI_API_BASE_URL
              value: http://litellm.puu-ai.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              value: none
            - name: DEFAULT_MODELS
              value: qwen3.8-27b-nvfp4
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/puu-os/open-webui
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: puu-ai
  labels:
    app.kubernetes.io/name: open-webui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
