apiVersion: v1
kind: Service
metadata:
  name: bonsai-2-27b
  namespace: puu-ai
  labels:
    app.kubernetes.io/name: bonsai-2-27b
spec:
  selector:
    app.kubernetes.io/name: bonsai-2-27b
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bonsai-2-27b-plugin-install
  namespace: puu-ai
data:
  serve.sh: |-
    #!/bin/sh
    set -eu
    apt_cache=/var/lib/vllm/apt
    mkdir -p "$apt_cache/lists/partial" "$apt_cache/archives/partial"
    if [ ! -f "$apt_cache/.ready" ]; then
      apt-get -o Dir::State::lists="$apt_cache/lists" update
    fi
    apt-get -o Dir::State::lists="$apt_cache/lists" \
      -o Dir::Cache::archives="$apt_cache/archives" \
      -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
      libcublas-dev-13-0 libcusparse-dev-13-0 libcusolver-dev-13-0
    touch "$apt_cache/.ready"
    target=/var/lib/vllm/plugins/prism-ternary-e5ed2454
    if [ ! -f "$target/.ready" ]; then
      mkdir -p "$(dirname "$target")"
      rm -rf "$target"
      python3 -m pip install --no-deps --break-system-packages --target "$target" \
        https://github.com/fraserprice/bonsai-vllm/archive/e5ed2454a6b06a857a2146ba8cc60b7814c54bdf.tar.gz
      touch "$target/.ready"
    fi
    exec vllm "$@"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonsai-2-27b
  namespace: puu-ai
  labels:
    app.kubernetes.io/name: bonsai-2-27b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bonsai-2-27b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bonsai-2-27b
        puu.ai/inference: "enabled"
        puu.ai/model-server: vllm
        puu.ai/model-capacity: gpu
        puu.ai/model-source: local-discovery
        puu.ai/cluster-routing: "enabled"
    spec:
      nodeSelector:
        puu.ai/cuda-ready: "true"
        puu.ai/cdi-ready: "true"
      runtimeClassName: nvidia-cdi
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:2cc49b81319f7a66a33dd8bd63a7bfddae079122b33ce51989b6828a1f038c37
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /install/serve.sh
          args:
            - serve
            - fraserprice/Ternary-Bonsai-2-27B-vllm
            - --revision
            - 1e1d7c0f5cb02b71d81b0574c54ddd1dc9088495
            - --served-model-name
            - Bonsai-2-27B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "1"
            - --max-num-batched-tokens
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --kv-cache-dtype
            - fp8
            - --language-model-only
            - --reasoning-parser
            - qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: HF_HOME
              value: /var/lib/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/lib/vllm/cache
            - name: PYTHONPATH
              value: /var/lib/vllm/plugins/prism-ternary-e5ed2454
            - name: TORCH_EXTENSIONS_DIR
              value: /var/lib/vllm/cache/torch_extensions
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: huggingface
              mountPath: /var/lib/huggingface
            - name: vllm
              mountPath: /var/lib/vllm
            - name: installer
              mountPath: /install
              readOnly: true
      volumes:
        - name: huggingface
          hostPath:
            path: /var/lib/huggingface
            type: DirectoryOrCreate
        - name: vllm
          hostPath:
            path: /var/lib/vllm
            type: DirectoryOrCreate
        - name: installer
          configMap:
            name: bonsai-2-27b-plugin-install
            defaultMode: 0755
