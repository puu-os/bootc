apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: litellm
  namespace: kube-system
spec:
  chart: oci://docker.litellm.ai/berriai/litellm-helm@sha256:e528ce9c544c55368ff2a1736136cc9154b85fb1d8084040848a4da3e813dcd4
  version: 1.90.1
  targetNamespace: puu-ai
  createNamespace: true
  valuesContent: |-
    fullnameOverride: litellm

    image:
      repository: ghcr.io/berriai/litellm
      tag: 1.90.1@sha256:09d98fd0c82d1a3731577fde7fe2f65db0afa4453e9da45c11ecda94d047248f
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 4000

    db:
      deployStandalone: false

    migrationJob:
      enabled: false

    proxy_config:
      model_list:
        - model_name: "*"
          litellm_params:
            model: openai/*
            api_base: http://llm-d-inference-gateway.puu-ai.svc.cluster.local/v1
            api_key: none
      general_settings:
        max_parallel_requests: 32
      router_settings:
        timeout: 300
        num_retries: 0

    extraResources:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: litellm-gateway
        spec:
          gatewayClassName: agentgateway
          listeners:
            - name: http
              protocol: HTTP
              port: 80
              allowedRoutes:
                namespaces:
                  from: Same
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: litellm
        spec:
          parentRefs:
            - name: litellm-gateway
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: litellm
                  port: 4000
