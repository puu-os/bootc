apiVersion: v1
kind: Service
metadata:
  name: bonsai-2-27b
  namespace: puu-ai
  labels:
    app.kubernetes.io/name: bonsai-2-27b
spec:
  selector:
    app.kubernetes.io/name: bonsai-2-27b
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonsai-2-27b
  namespace: puu-ai
  labels:
    app.kubernetes.io/name: bonsai-2-27b
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bonsai-2-27b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bonsai-2-27b
        puu.ai/inference: "enabled"
        puu.ai/model-server: vllm
        puu.ai/model-capacity: gpu
        puu.ai/model-source: local-discovery
        puu.ai/cluster-routing: "enabled"
    spec:
      nodeSelector:
        puu.ai/cuda-ready: "true"
        puu.ai/cdi-ready: "true"
      runtimeClassName: nvidia-cdi
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:2cc49b81319f7a66a33dd8bd63a7bfddae079122b33ce51989b6828a1f038c37
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
            - prism-ml/Ternary-Bonsai-2-27B
            - --served-model-name
            - prism-ml/bonsai-2-27b
            - bonsai-2-27b
            - Bonsai-2-27B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "512"
            - --max-num-seqs
            - "1"
            - --max-num-batched-tokens
            - "512"
            - --gpu-memory-utilization
            - "0.5"
            - --kv-cache-dtype
            - fp8
            - --language-model-only
            - --reasoning-parser
            - qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: HF_HOME
              value: /var/lib/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/lib/vllm/cache
            - name: TORCH_EXTENSIONS_DIR
              value: /var/lib/vllm/cache/torch_extensions
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: huggingface
              mountPath: /var/lib/huggingface
            - name: vllm
              mountPath: /var/lib/vllm
      volumes:
        - name: huggingface
          hostPath:
            path: /var/lib/huggingface
            type: DirectoryOrCreate
        - name: vllm
          hostPath:
            path: /var/lib/vllm
            type: DirectoryOrCreate
