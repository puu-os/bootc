[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oksa"
version = "1.0"
requires-python = ">=3.10"
description = "Puu model-serving bootstrap"
license = { file = "LICENSE" }
dependencies = []

[tool.hatch.build]
dev-mode-dirs = ["bin"]

[tool.hatch.build.targets.sdist]
include = ["/bin", "/manifests", "/systemd", "/vllm", "/oksa.conf", "/LICENSE", "/pyproject.toml"]
exclude = ["__pycache__"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.shared-data]
"bin/oksa-install-k3s-addons" = "usr/libexec/puu/oksa-install-k3s-addons"
"bin/oksa-init-litellm-db" = "usr/libexec/puu/oksa-init-litellm-db"
"bin/oksa_cluster.py" = "usr/libexec/puu/oksa_cluster.py"
