# Default puu-install configuration.

branding:
  name: Puu

partitions:
  efi: 2G

labels:
  root: puu-root
  swap: puu-swap
  home: puu-home

identity:
  keymap: us
  locale: en_US.UTF-8
  timezone: UTC
  hostname: puu

homed:
  groups:
    - adm
    - audio
    - cdrom
    - dip
    - input
    - lpadmin
    - netdev
    - plugdev
    - render
    - sudo
    - video
    - wheel
    - realtime
    - uucp
  identityPath: /var/lib/puu/identity.json
  sessionLauncher: gnome

seeds:
  - name: flatpak
    target: /var/lib/flatpak
    liveStore: /var/lib/flatpak
    syncHelper: /usr/libexec/puu/puu-flatpak-sync
    manifestPath: /usr/share/puu/flatpaks.list
  - name: models
    target: /var/lib/vllm/models
    liveStore: /var/lib/vllm/models

k3s:
  role: server

kernelArgs:
  - vt.global_cursor_default=0
  - console=tty0
  - threadirqs
  - preempt=full

serialConsole:
  x86_64: console=ttyS0,115200
  aarch64: console=tty0
