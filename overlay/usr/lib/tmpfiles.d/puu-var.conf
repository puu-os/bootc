# Age and clean transient/cache directories.

e /var/cache/puu       - - - 14d
e /var/cache/dnf       - - - 14d
e /var/tmp             - - - 30d

# Initialize persistent state directories under /var.
d /var/lib/flatpak             0755 root  root  -
d /var/lib/flatpak/exports     0755 root  root  -
d /var/lib/flatpak/repo        0755 root  root  -
d /var/lib/puu                 0700 root  root  -
d /var/empty                   0755 root  root  -
d /var/lib/huggingface         0755 root  root  -
d /var/lib/vllm                0755 root  root  -
d /var/lib/vllm/cache          0755 root  root  -
d /var/lib/vllm/models         0755 root  root  -
d /run/puu                  0755 root  root  -

# Link /home to /var/home for user data.
L /home                        -    -     -     - /var/home

# Link CNI plugin directory for container runtimes.
L+ /var/opt/cni                -    -     -     - /usr/lib/cni
