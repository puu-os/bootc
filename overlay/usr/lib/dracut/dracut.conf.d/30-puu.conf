# Explicit systemd and udev paths for dracut under --sysroot.
systemdutildir=/usr/lib/systemd
systemdsystemunitdir=/usr/lib/systemd/system
udevdir=/usr/lib/udev
install_items+=" /lib64 /lib/firmware/regulatory.db /lib/firmware/regulatory.db.p7s "
install_items+=" /etc/modprobe.d/nvidia.conf "
omit_drivers+=" nouveau "
omit_dracutmodules+=" shell-interpreter btrfs "
add_dracutmodules+=" puu-live "
add_dracutmodules+=" plymouth "
install_items+=" /usr/share/plymouth/themes/puu/puu.plymouth /usr/share/plymouth/themes/puu/puu.script /usr/share/plymouth/themes/puu/splash.png "
